# Local development services. Not intended for production use.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dalali
      POSTGRES_PASSWORD: dalali_dev_password
      POSTGRES_DB: dalali_trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalali -d dalali_trust"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
